; Two supported boards, same GC9A01 240x240 round panel:
;  - supermini:       ESP32-C3 Super Mini + bare 1.28" GC9A01 module (manual wiring)
;  - xiao_c6_round:   Seeed XIAO ESP32-C6 + Seeed "Round Display for XIAO" (direct connector)

[env]
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"
[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

; Official espressif32 platform has no Arduino-framework support for ESP32-C6 yet,
; so this env uses the community pioarduino fork instead (bundles Arduino-esp32 core).
[env:xiao_c6_round]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  -DPLANE_RADAR_BOARD_XIAO_C6_ROUND
